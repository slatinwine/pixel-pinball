<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>像素弹珠台 · PIXEL PINBALL</title>
<style>
  :root{color-scheme:dark}
  *{box-sizing:border-box}
  body{margin:0;padding:16px 12px 28px;
       background:#04050d radial-gradient(1200px 700px at 50% -10%, #101838 0%, #04050d 60%);
       color:#9aa7c9;font-family:"Courier New",ui-monospace,Consolas,monospace;
       display:flex;flex-direction:column;align-items:center;gap:12px;
       -webkit-user-select:none;user-select:none}
  h1{margin:2px 0 0;font-size:15px;letter-spacing:4px;color:#e8ecf5;font-weight:700}
  h1 span{color:#ffb64a}
  .sub{font-size:11px;color:#5d6b96;letter-spacing:1px}
  .cabinet{position:relative;border:5px solid #1d2750;border-radius:12px;overflow:hidden;
           box-shadow:0 0 0 2px #0a0f24,0 14px 50px rgba(30,60,180,.25),inset 0 0 40px #000}
  canvas{display:block;width:min(94vw,calc(86vh*0.7368));height:auto;
         image-rendering:pixelated;background:#000}
  .crt{position:absolute;inset:0;pointer-events:none;
       background:repeating-linear-gradient(0deg,rgba(0,0,0,.15) 0 1px,transparent 1px 3px);
       box-shadow:inset 0 0 90px rgba(0,0,10,.55)}
  .hint{font-size:12px;line-height:1.9;color:#6d7ba6;text-align:center;max-width:620px}
  .hint b{color:#cdd8ff}
  kbd{background:#16204a;border:1px solid #33427f;border-bottom-width:3px;border-radius:4px;
      padding:0 6px;color:#e8ecf5;font-family:inherit}
  .pads{display:none;gap:8px;width:min(94vw,560px)}
  @media(pointer:coarse){.pads{display:flex}}
  .pads button{flex:1;padding:18px 0;font-size:16px;letter-spacing:2px;background:#141d44;
       color:#cdd8ff;border:2px solid #33427f;border-radius:12px;touch-action:none}
  .pads button:active{background:#24327a}
</style>
</head>
<body>
<h1>像素弹珠台 <span>PIXEL PINBALL</span></h1>
<div class="sub">SPACE CADET TRIBUTE · EST.1995</div>
<div class="cabinet">
  <canvas id="cv" width="560" height="760"></canvas>
  <div class="crt"></div>
</div>
<div class="hint">
  <kbd>Z</kbd>/<kbd>←</kbd> 左挡板 · <kbd>/</kbd>/<kbd>→</kbd> 右挡板 · 按住<kbd>空格</kbd>蓄力发射 · <kbd>N</kbd> 拍打台面（用力过猛会 <b>TILT</b>）<br>
  <kbd>P</kbd> 暂停 · <kbd>M</kbd> 静音 · 集齐顶端 <b>C-A-D-E-T</b> 五灯提升得分倍率并点亮 <b>EXTRA BALL</b> ·
  打碎右侧三个靶标点亮 <b>KICKBACK</b> · 球送进左上弹窝(Saucer)得分/奖励球
</div>
<div class="pads">
  <button id="padL">◀ 挡板</button>
  <button id="padP">发射 ▼</button>
  <button id="padR">挡板 ▶</button>
</div>
<script>
'use strict';
/* ==================== basic ==================== */
const cv=document.getElementById('cv');
const ctx=cv.getContext('2d');
const W=560,H=760;
const BALL_R=7,GRAV=1250,DT=1/240,MAXV=1400;

let T=0,mode='attract',paused=false,muted=false;
let score=0,balls=3,ballNo=1,mult=1,high=0;
try{high=parseInt(localStorage.getItem('pixpin.high')||'0',10)||0;}catch(e){}

const keys={left:false,right:false,space:false};
const ball={x:353,y:690,vx:0,vy:0,px:353,py:690};
let trail=[];
let power=0;
let tilt=false,heat=0,stuckT=0;
let spin=0,spinA=0;
let lanesL=[0,0,0,0,0],lanesFlashT=0;
let targetsUp=[1,1,1],bankT=0;
let kickLit=false,extraLit=false;
let captured=false,capT=0,capCd=0;
let saveArmed=false,saveT=0,skillT=0;
let shake=0,shx=0,shy=0;
let comboN=0,comboT=0;
let drainT=0,overT=0,acc=0;
let centerFlash=null;
let msgs=[];
const SLINGF=[0,0];
let demo={x:190,y:470,vy:0};

/* ==================== pixel font (3x5) ==================== */
const FONT={
'0':'111101101101111','1':'010110010010111','2':'111001111100111','3':'111001011001111',
'4':'101101111001001','5':'111100111001111','6':'111100111101111','7':'111001001010010',
'8':'111101111101111','9':'111101111001111',
A:'010101111101101',B:'110101110101110',C:'011100100100011',D:'110101101101110',
E:'111100110100111',F:'111100110100100',G:'011100101101011',H:'101101111101101',
I:'111010010010111',J:'001001001101010',K:'101101110101101',L:'100100100100111',
M:'101111111101101',N:'111101101101101',O:'111101101101111',P:'111101111100100',
Q:'111101101111001',R:'111101110101101',S:'011100010001110',T:'111010010010010',
U:'101101101101111',V:'101101101101010',W:'101101111111101',X:'101101010101101',
Y:'101101010010010',Z:'111001010100111',
'.':'000000000000010',',':'000000000010100','!':'010010010000010','\'':'010010000000000',
'-':'000000111000000',':':'000010000010000','/':'001001010100100','+':'000010111010000',
'*':'101010111010101','(':'010100100100010',')':'010001001001010','=':'000111000111000',
'?':'111001011000010','<':'001010100010001','>':'100010001010100','%':'101001010100101'
};
function text(str,x,y,sc,c,al){
  str=String(str).toUpperCase();
  const w=str.length*4*sc-sc;
  if(al==='center')x=Math.round(x-w/2);else if(al==='right')x=Math.round(x-w);
  x=Math.round(x);y=Math.round(y);ctx.fillStyle=c;
  for(let i=0;i<str.length;i++){
    const g=FONT[str[i]];if(!g)continue;
    for(let r=0;r<5;r++)for(let cix=0;cix<3;cix++){
      if(g[r*3+cix]==='1')ctx.fillRect(x+i*4*sc+cix*sc,y+r*sc,sc,sc);
    }
  }
}

/* ==================== pixel draw helpers ==================== */
function rect(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h));}
function circle(cx,cy,r,c){cx=Math.round(cx);cy=Math.round(cy);r=Math.round(r);ctx.fillStyle=c;
  for(let dy=-r;dy<=r;dy++){const dx=Math.floor(Math.sqrt(r*r-dy*dy));ctx.fillRect(cx-dx,cy+dy,dx*2+1,1);}}
function ring(cx,cy,r,c){cx=Math.round(cx);cy=Math.round(cy);ctx.fillStyle=c;
  let x=Math.round(r),y=0,err=1-x;
  while(x>=y){
    ctx.fillRect(cx+x,cy+y,1,1);ctx.fillRect(cx+y,cy+x,1,1);
    ctx.fillRect(cx-y,cy+x,1,1);ctx.fillRect(cx-x,cy+y,1,1);
    ctx.fillRect(cx-x,cy-y,1,1);ctx.fillRect(cx-y,cy-x,1,1);
    ctx.fillRect(cx+y,cy-x,1,1);ctx.fillRect(cx+x,cy-y,1,1);
    y++;if(err<0)err+=2*y+1;else{x--;err+=2*(y-x)+1;}
  }}
function line(x0,y0,x1,y1,wd,c){
  x0=Math.round(x0);y0=Math.round(y0);x1=Math.round(x1);y1=Math.round(y1);
  ctx.fillStyle=c;
  const dx=Math.abs(x1-x0),dy=Math.abs(y1-y0),sx=x0<x1?1:-1,sy=y0<y1?1:-1;
  let err=dx-dy,x=x0,y=y0;const o=Math.floor(wd/2);
  for(;;){ctx.fillRect(x-o,y-o,wd,wd);if(x===x1&&y===y1)break;
    const e2=2*err;if(e2>-dy){err-=dy;x+=sx;}if(e2<dx){err+=dx;y+=sy;}}}
function tri(p,c){ctx.fillStyle=c;
  const y0=Math.round(Math.min(p[0][1],p[1][1],p[2][1])),y1=Math.round(Math.max(p[0][1],p[1][1],p[2][1]));
  for(let y=y0;y<=y1;y++){let xa=1e9,xb=-1e9;
    for(let i=0;i<3;i++){const a=p[i],b=p[(i+1)%3];
      if((y>=a[1]&&y<b[1])||(y>=b[1]&&y<a[1])){
        const x=a[0]+(y-a[1])/(b[1]-a[1])*(b[0]-a[0]);
        if(x<xa)xa=x;if(x>xb)xb=x;}}
    if(xb>=xa)ctx.fillRect(Math.round(xa),y,Math.round(xb-xa)+1,1);}}

/* ==================== audio (chip bleeps) ==================== */
let AC=null;
function ac(){
  if(muted)return null;
  if(!AC){const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;
    try{AC=new C();}catch(e){return null;}}
  if(AC.state==='suspended')AC.resume();
  return AC;
}
function tone(f0,f1,dur,type,vol){
  const a=ac();if(!a)return;
  try{
    const o=a.createOscillator(),g=a.createGain(),t=a.currentTime;
    o.type=type||'square';
    o.frequency.setValueAtTime(Math.max(30,f0),t);
    o.frequency.exponentialRampToValueAtTime(Math.max(30,f1||f0),t+dur);
    g.gain.setValueAtTime(vol||0.1,t);
    g.gain.exponentialRampToValueAtTime(0.0008,t+dur);
    o.connect(g);g.connect(a.destination);
    o.start(t);o.stop(t+dur+0.03);
  }catch(e){}
}
const SFX={
  flip(){tone(95,70,0.045,'square',0.10);},
  bump(n){const f=290+Math.min(n,8)*36;tone(f,f*1.5,0.055,'square',0.12);},
  sling(){tone(210,330,0.05,'square',0.11);},
  post(){tone(150,120,0.04,'square',0.08);},
  target(){tone(520,760,0.05,'square',0.11);},
  bank(){[440,554,659,880].forEach((f,i)=>setTimeout(()=>tone(f,f,0.09,'square',0.11),i*70));},
  lane(){tone(660,880,0.05,'square',0.09);},
  cadet(){[523,659,784,1046,1318].forEach((f,i)=>setTimeout(()=>tone(f,f,0.1,'square',0.11),i*80));},
  cap(){tone(240,90,0.25,'sine',0.13);},
  eject(){tone(300,900,0.16,'square',0.11);},
  launch(){tone(110,720,0.22,'square',0.12);},
  drain(){tone(420,70,0.45,'sawtooth',0.12);},
  extra(){[659,784,988,1318].forEach((f,i)=>setTimeout(()=>tone(f,f,0.12,'square',0.12),i*90));},
  tilt(){tone(110,60,0.5,'sawtooth',0.14);},
  save(){tone(523,784,0.12,'square',0.11);setTimeout(()=>tone(784,1046,0.12,'square',0.11),120);},
  spin(){tone(820,900,0.03,'triangle',0.07);},
  kick(){tone(200,700,0.18,'square',0.12);},
  nudge(){tone(60,50,0.06,'square',0.09);},
  clack(){tone(180,140,0.05,'square',0.09);}
};

/* ==================== table geometry ==================== */
const SEGS=[];
function seg(x1,y1,x2,y2,o){const s=Object.assign({x1,y1,x2,y2,w:2,e:0.35},o||{});SEGS.push(s);return s;}
// top arc: center (190,180) R=180, from (10,180) to (370,180)
(function(){let px=10,py=180;const N=30;
  for(let i=1;i<=N;i++){const th=Math.PI-Math.PI*i/N;
    const x=190+180*Math.cos(th),y=180-180*Math.sin(th);
    seg(px,py,x,y);px=x;py=y;}})();
seg(10,180,10,660);            // left wall
seg(10,660,80,700);            // funnel L
seg(80,700,100,700);           // shelf L (outlane floor)
seg(46,578,46,648);            // inlane divider L
seg(46,648,104,676);           // divider L lower
seg(336,160,336,660);          // launch-lane inner wall
seg(336,660,266,700);          // funnel R
seg(266,700,246,700);          // shelf R
seg(300,578,300,648);          // divider R
seg(300,648,242,676);          // divider R lower
seg(370,180,370,742);          // lane outer wall
seg(336,742,370,742,{e:0.1});  // lane floor
seg(330,166,370,154,{e:0.3,oneWayN:{x:-0.287,y:-0.957}}); // one-way gate over the lane mouth: launches pass up through it, returning balls slide off its left edge back into the field
seg(70,182,70,330);            // left orbit lane wall
// slingshots (kick face gets extra impulse)
function sling(ax,ay,bx,by,cx2,cy2,idx){
  seg(ax,ay,bx,by,{e:0.4});
  seg(bx,by,cx2,cy2,{e:0.4});
  let nx=cy2-ay,ny=ax-cx2;const L=Math.hypot(nx,ny);nx/=L;ny/=L;
  const mx=(ax+cx2)/2-bx,my=(ay+cy2)/2-by;
  if(nx*mx+ny*my<0){nx=-nx;ny=-ny;}
  seg(cx2,cy2,ax,ay,{e:0.2,kick:{x:nx,y:ny},mx:idx});
}
sling(72,598,72,636,108,617,0);
sling(274,598,274,636,238,617,1);
// drop targets on right wall
const TARGET_Y=[332,368,404];
TARGET_Y.forEach((yc,i)=>seg(312,yc-7,312,yc+7,{e:0.5,target:i}));

const BUMPERS=[{x:120,y:250,r:19,f:0},{x:218,y:232,r:19,f:0},{x:168,y:318,r:19,f:0}];
const POSTS=[{x:86,y:470,r:8},{x:260,y:470,r:8}];
const SAUCER={x:40,y:150,r:13};
// rollover lanes C-A-D-E-T (dividers are real posts)
const LANES=[];
(function(){const xs=[76,117,158,199,240,281];
  for(let i=0;i<xs.length;i++)seg(xs[i],95,xs[i],150,{e:0.45});
  for(let i=0;i<5;i++)LANES.push({x1:xs[i],x2:xs[i+1],ch:'CADET'[i]});})();

function mkFlip(px,py,dir){return{px,py,dir,L:48,r:6,
  rest:dir>0?0.62:Math.PI-0.62,upA:dir>0?-0.62:Math.PI+0.62,
  th:dir>0?0.62:Math.PI-0.62,om:0,up:false};}
const fl=mkFlip(120,690,1),fr=mkFlip(226,690,-1);
function tipX(f){return f.px+Math.cos(f.th)*f.L;}
function tipY(f){return f.py+Math.sin(f.th)*f.L;}

// starfield
const STARS=[];
(function(){let s=42;const rnd=()=>((s=(s*1103515245+12345)&0x7fffffff)/0x7fffffff);
  for(let i=0;i<110;i++)STARS.push({x:6+rnd()*368,y:8+rnd()*744,p:rnd()*6.28});})();

/* ==================== score / messages ==================== */
function msg(t,c){msgs.push({t:String(t).toUpperCase(),ttl:2.6,c:c||'#ffb64a'});if(msgs.length>6)msgs.shift();}
function flash(txt,c,s){centerFlash={t:1.4,txt:String(txt).toUpperCase(),c:c||'#4ef0ff',s:s||3};}
function addScore(n,fixed){if(tilt)return;score+=fixed?n:n*mult;if(score>high)high=score;}

/* ==================== game control ==================== */
function lanesReset(){lanesL=[0,0,0,0,0];lanesFlashT=0;}
function targetsReset(){targetsUp=[1,1,1];bankT=0;}
function plY(){return 700+power*26;}
function newBall(){
  tilt=false;heat=0;stuckT=0;spin=0;captured=false;capT=0;capCd=0;power=0;acc=0;
  saveT=0; // armed by startGame/afterBall, counts down from launch
  mode='plunger';ball.x=353;ball.y=plY()-8;ball.vx=0;ball.vy=0;ball.px=ball.x;ball.py=ball.y;
  trail=[];
}
function startGame(){
  score=0;balls=3;ballNo=1;mult=1;kickLit=false;extraLit=false;saveArmed=true;
  msgs=[];lanesReset();targetsReset();
  msg('GOOD LUCK','#57ff9a');
  newBall();
}
function launchBall(){
  mode='play';ball.vx=0;ball.vy=-(430+power*880);power=0;
  saveT=6;skillT=3.5;SFX.launch();
}
function ballLost(){
  if(saveArmed&&saveT>0){
    saveArmed=false;msg('BALL SAVED','#4ef0ff');flash('BALL SAVED','#4ef0ff',2);
    SFX.save();newBall();return;
  }
  mode='between';drainT=1.35;SFX.drain();
  if(!tilt)flash('BALL LOST','#ff5a5a',2);
}
function afterBall(){
  balls--;
  if(balls>0){
    ballNo++;mult=1;kickLit=false;lanesReset();targetsReset();
    saveArmed=true;
    msg('BALL '+ballNo,'#57ff9a');newBall();
  }else{
    mode='over';overT=0;
    try{localStorage.setItem('pixpin.high',String(high));}catch(e){}
  }
}
function setKey(k,down){
  if(k==='space'){
    keys.space=down;
    if(down){
      if(mode==='attract')startGame();
      else if(mode==='over'&&overT>0.8)startGame();
    }else if(mode==='plunger'&&power>0.02)launchBall();
  }else if(k==='left'){
    keys.left=down;
    if(down&&!tilt&&(mode==='play'||mode==='plunger'))SFX.flip();
  }else if(k==='right'){
    keys.right=down;
    if(down&&!tilt&&(mode==='play'||mode==='plunger'))SFX.flip();
  }
}
function nudge(){
  if(mode!=='play'||tilt)return;
  ball.vy-=90;ball.vx+=(Math.random()-0.5)*40;
  shake=5;heat+=1.05;SFX.nudge();
  if(heat>=3){tilt=true;flash('TILT!','#ff5a5a',4);msg('TILT - FLIPPERS DEAD','#ff5a5a');SFX.tilt();}
}

/* ==================== physics ==================== */
function flipStep(f,dt){
  const prev=f.th,tgt=f.up?f.upA:f.rest,rate=f.up?24:13;
  const d=tgt-f.th,mx=rate*dt;
  f.th+=Math.max(-mx,Math.min(mx,d));
  f.om=(f.th-prev)/dt;
}
function collideSegs(){
  const b=ball,R=BALL_R;
  for(const s of SEGS){
    if(s.target!==undefined&&!targetsUp[s.target])continue;
    if(s.oneWay&&b.x>s.x1-0.5)continue;
    if(s.oneWayN&&(b.vx*s.oneWayN.x+b.vy*s.oneWayN.y)>0)continue;
    const ex=s.x2-s.x1,ey=s.y2-s.y1,len2=ex*ex+ey*ey;
    let t=len2>0?((b.x-s.x1)*ex+(b.y-s.y1)*ey)/len2:0;
    t=t<0?0:t>1?1:t;
    const qx=s.x1+ex*t,qy=s.y1+ey*t;
    const dx=b.x-qx,dy=b.y-qy,d=Math.hypot(dx,dy),RR=R+s.w;
    if(d>=RR||d===0)continue;
    const nx=dx/d,ny=dy/d;
    b.x+=nx*(RR-d);b.y+=ny*(RR-d);
    const vn=b.vx*nx+b.vy*ny;
    if(vn<0){
      b.vx-=(1+s.e)*vn*nx;b.vy-=(1+s.e)*vn*ny;
      b.vx*=0.999;b.vy*=0.999;
      if(s.kick&&!tilt){
        b.vx+=s.kick.x*410;b.vy+=s.kick.y*410;
        SLINGF[s.mx]=0.18;addScore(25);SFX.sling();
      }
      if(s.target!==undefined)hitTarget(s.target);
    }
  }
}
function collidePosts(){
  const b=ball,R=BALL_R;
  for(const p of POSTS){
    const dx=b.x-p.x,dy=b.y-p.y,d=Math.hypot(dx,dy),RR=R+p.r;
    if(d>=RR||d===0)continue;
    const nx=dx/d,ny=dy/d;
    b.x=p.x+nx*RR;b.y=p.y+ny*RR;
    const vn=b.vx*nx+b.vy*ny;
    if(vn<0){b.vx-=1.9*vn*nx;b.vy-=1.9*vn*ny;addScore(10);SFX.post();}
  }
}
function collideBumpers(){
  const b=ball,R=BALL_R;
  for(const p of BUMPERS){
    const dx=b.x-p.x,dy=b.y-p.y,d=Math.hypot(dx,dy),RR=R+p.r;
    if(d>=RR)continue;
    let nx=d>0?dx/d:0,ny=d>0?dy/d:-1;
    const ja=(Math.random()-0.5)*0.12,ca=Math.cos(ja),sa=Math.sin(ja);
    const rx=nx*ca-ny*sa,ry=nx*sa+ny*ca;nx=rx;ny=ry;
    b.x=p.x+nx*RR;b.y=p.y+ny*RR;
    const vn=b.vx*nx+b.vy*ny;
    if(vn<0){b.vx-=vn*nx;b.vy-=vn*ny;}
    b.vx+=nx*390;b.vy+=ny*390;
    p.f=0.22;comboT=0.9;comboN++;
    if(!tilt){addScore(100);SFX.bump(comboN);}else SFX.post();
  }
}
function collideFlipper(f){
  const b=ball,RR=BALL_R+f.r;
  const tx=tipX(f),ty=tipY(f);
  const ex=tx-f.px,ey=ty-f.py,len2=ex*ex+ey*ey;
  let t=((b.x-f.px)*ex+(b.y-f.py)*ey)/len2;t=t<0?0:t>1?1:t;
  const qx=f.px+ex*t,qy=f.py+ey*t;
  const dx=b.x-qx,dy=b.y-qy,d=Math.hypot(dx,dy);
  if(d>=RR||d===0)return;
  const nx=dx/d,ny=dy/d;
  b.x+=nx*(RR-d);b.y+=ny*(RR-d);
  const vx=f.om*-(qy-f.py),vy=f.om*(qx-f.px);
  let rvx=b.vx-vx,rvy=b.vy-vy;
  const vn=rvx*nx+rvy*ny;
  if(vn<0){
    rvx-=1.3*vn*nx;rvy-=1.3*vn*ny;
    b.vx=vx+rvx;b.vy=vy+rvy;
    if(Math.abs(f.om)>3){
      const k=130*Math.min(1,Math.abs(f.om)/16);
      b.vx+=nx*k;b.vy+=ny*k;
    }
  }
}
function hitTarget(i){
  targetsUp[i]=0;SFX.target();
  if(!targetsUp.some(v=>v))bankT=1.4;
  if(tilt)return;
  addScore(500);msg('TARGET 500','#ff8c2e');
  if(!targetsUp.some(v=>v)){
    addScore(5000,true);kickLit=true;
    flash('BANK CLEAR! 5000','#ff8c2e',2);msg('KICKBACK LIT','#ff8c2e');SFX.bank();
  }
}
function releaseSaucer(){
  captured=false;capCd=1.0;
  ball.x=SAUCER.x+8;ball.y=SAUCER.y+6;ball.vx=200;ball.vy=-560;
  SFX.eject();
  if(extraLit&&!tilt){
    balls++;extraLit=false;
    flash('EXTRA BALL!','#57ff9a',3);msg('EXTRA BALL','#57ff9a');SFX.extra();
  }else if(!tilt){addScore(2500);msg('SAUCER 2500','#4ef0ff');}
}
function zones(){
  const b=ball;
  capCd=Math.max(0,capCd-DT);
  // saucer capture (hole spans the whole lane mouth)
  if(!captured&&capCd<=0){
    const dx=b.x-SAUCER.x,dy=b.y-SAUCER.y;
    if(dy*dy<12*12&&b.x<68&&b.x>10){
      captured=true;capT=1.15;b.vx=0;b.vy=0;b.x=SAUCER.x;b.y=SAUCER.y;
      SFX.cap();if(!tilt)msg('SAUCER','#4ef0ff');
      return;
    }
  }
  // spinner crossing
  if((b.py<255&&b.y>=255)||(b.py>255&&b.y<=255)){
    if(b.x>14&&b.x<64){
      const s2=Math.hypot(b.vx,b.vy);
      spin=Math.min(30,spin+4+s2*0.02);
      if(!tilt){addScore(100);msg('SPINNER 100','#c9d4f5');}
      SFX.spin();
    }
  }
  // rollover lanes
  if((b.py<118&&b.y>=118)||(b.py>118&&b.y<=118)){
    for(let i=0;i<LANES.length;i++){
      const L=LANES[i];
      if(b.x>L.x1+3&&b.x<L.x2-3&&!lanesL[i]){
        lanesL[i]=1;SFX.lane();
        if(!tilt){
          addScore(500);msg(L.ch+' LANE 500','#4ef0ff');
          if(skillT>0){skillT=0;addScore(5000,true);flash('SKILL SHOT!','#57ff9a',3);SFX.extra();}
          if(lanesL.every(v=>v===1)){
            for(let j=0;j<5;j++)lanesL[j]=2;
            lanesFlashT=0.9;
            mult=Math.min(6,mult+1);addScore(10000,true);extraLit=true;
            flash('MULTIPLIER X'+mult,'#ffb64a',3);
            msg('CADET COMPLETE 10000','#57ff9a');SFX.cadet();
          }
        }
        break;
      }
    }
  }
  // fell back onto plunger
  if(b.x>341&&b.vy>0&&b.y>655){
    mode='plunger';power=0;b.vx=0;b.vy=0;
    msg('BALL RETURNED','#8a97c4');SFX.clack();
    return;
  }
  // kickback (right outlane)
  if(b.y>700&&b.vy>0&&b.x>222&&b.x<250){
    if(kickLit&&!tilt){
      kickLit=false;b.y=698;b.vy=-760;b.vx*=0.2;
      flash('KICKBACK!','#ff8c2e',2);msg('KICKBACK SAVE','#ff8c2e');
      SFX.kick();shake=4;return;
    }
  }
  // drain
  if(b.y>726&&b.x<338)ballLost();
}
function sub(dt){
  flipStep(fl,dt);flipStep(fr,dt);
  const b=ball;
  b.px=b.x;b.py=b.y;
  b.vy+=GRAV*dt;
  const sp=Math.hypot(b.vx,b.vy);
  if(sp>MAXV){b.vx*=MAXV/sp;b.vy*=MAXV/sp;}
  b.x+=b.vx*dt;b.y+=b.vy*dt;
  for(let it=0;it<2;it++){
    collideSegs();
    collidePosts();
    collideBumpers();
    collideFlipper(fl);collideFlipper(fr);
  }
  zones();
}

/* ==================== update ==================== */
function update(dt){
  if(paused)return;
  T+=dt;
  shake=Math.max(0,shake-dt*14);
  shx=(Math.random()-0.5)*shake*2;shy=(Math.random()-0.5)*shake*2;
  heat=Math.max(0,heat-dt*0.55);
  if(comboT>0){comboT-=dt;if(comboT<=0)comboN=0;}
  for(const p of BUMPERS)if(p.f>0)p.f-=dt;
  SLINGF[0]=Math.max(0,SLINGF[0]-dt);SLINGF[1]=Math.max(0,SLINGF[1]-dt);
  if(centerFlash){centerFlash.t-=dt;if(centerFlash.t<=0)centerFlash=null;}
  for(const m of msgs)m.ttl-=dt;
  while(msgs.length&&msgs[0].ttl<=0)msgs.shift();
  spin=Math.max(0,spin-26*dt);spinA+=spin*6.5*dt;
  if(lanesFlashT>0){lanesFlashT-=dt;if(lanesFlashT<=0)lanesReset();}
  if(bankT>0){bankT-=dt;if(bankT<=0){targetsReset();SFX.clack();msg('TARGETS RESET','#8a97c4');}}
  if(skillT>0)skillT-=dt;
  if(saveT>0)saveT-=dt;

  if(mode==='attract'){
    demo.vy+=GRAV*0.5*dt;demo.y+=demo.vy*dt;
    demo.x=190+Math.sin(T*1.1)*130;
    if(demo.y>640){demo.y=640;demo.vy=-420;}
    return;
  }
  if(mode==='over'){overT+=dt;if(overT>10)mode='attract';return;}
  if(mode==='between'){drainT-=dt;if(drainT<=0)afterBall();return;}

  fl.up=!tilt&&keys.left;
  fr.up=!tilt&&keys.right;
  flipStep(fl,dt);flipStep(fr,dt);

  if(mode==='plunger'){
    if(keys.space&&power<1)power=Math.min(1,power+dt*1.4);
    ball.x=353;ball.y=plY()-8;ball.vx=0;ball.vy=0;
    trail.length=0;
    return;
  }
  // play
  if(captured){
    capT-=dt;if(capT<=0)releaseSaucer();
    trail.length=0;
    return;
  }
  acc+=dt;let n=0;
  while(acc>=DT&&n<14){sub(DT);acc-=DT;n++;if(mode!=='play')break;}
  if(mode!=='play')return;
  trail.push({x:ball.x,y:ball.y});if(trail.length>7)trail.shift();
  // anti-stuck
  const spd=Math.hypot(ball.vx,ball.vy);
  if(spd<6)stuckT+=dt;else stuckT=0;
  if(stuckT>2.5){ball.vy-=160;ball.vx+=(Math.random()-0.5)*60;stuckT=0;SFX.nudge();}
}

/* ==================== render ==================== */

}

  // spinner
  {
    const dx=Math.sin(spinA)*20,dy=Math.cos(spinA)*5;

    rect(38,252,4,6,'#5568a8');
  }
  // saucer
  circle(SAUCER.x,SAUCER.y,SAUCER.r,'#0c1230');
  ring(SAUCER.x,SAUCER.y,SAUCER.r,extraLit?(Math.sin(T*8)>0?'#57ff9a':'#1f8a4f'):'#31407c');
  if(captured&&Math.sin(T*20)>0)circle(SAUCER.x,SAUCER.y,4,'#e8ecf5');
  // bumpers
  for(const p of BUMPERS){
    const hot=p.f>0;
    circle(p.x,p.y,p.r,hot?'#ffffff':'#a12626');

    circle(p.x,p.y,6,hot?'#ffffff':'#ffd24a');
    if(hot)ring(p.x,p.y,p.r+Math.round((p.f/0.22)*8),'#ffffff');
    else ring(p.x,p.y,p.r,'#5c1616');
  }
  // slingshots
  tri([[72,598],[72,636],[108,617]],SLINGF[0]>0?'#ffffff':'#c9304f');
  line(108,617,72,598,1,'#ff8ca0');
  tri([[274,598],[274,636],[238,617]],SLINGF[1]>0?'#ffffff':'#c9304f');
  line(238,617,274,598,1,'#ff8ca0');
  // drop targets
  TARGET_Y.forEach((yc,i)=>{
    if(targetsUp[i]){rect(312,yc-7,24,14,'#ff8c2e');rect(314,yc-5,20,4,'#ffd9a8');}
    else rect(312,yc-7,24,14,'#101736');
  });
  // kickback lamp
  circle(236,708,5,kickLit?(Math.sin(T*10)>0?'#ff8c2e':'#7a4216'):'#22284a');
  // posts
  for(const p of POSTS){circle(p.x,p.y,p.r,'#c9d4f5');circle(p.x,p.y,p.r-3,'#5568a8');}
  // plunger
  const py2=plY();
  rect(349,py2,8,742-py2,'#5d74b8');
  rect(342,py2-5,22,5,'#ffd24a');
  if(power>0){
    const h=Math.round(power*40);
    rect(374,742-h,4,h,power>0.75?'#ff5a5a':(power>0.4?'#ffd24a':'#57ff9a'));
  }
  // flippers
  drawFlip(fl,'#ffd24a');drawFlip(fr,'#ffd24a');
  // ball
  if(mode==='play'||mode==='plunger'){
    const tc=['#1c2447','#26305c','#31407c'];
    for(let i=0;i<trail.length;i++){
      rect(trail[i].x-1,trail[i].y-1,2,2,tc[i%3]);
    }
    circle(ball.x,ball.y,8,'#1a2140');
    circle(ball.x,ball.y,7,'#dfe6f5');
    rect(Math.round(ball.x)-3,Math.round(ball.y)-4,2,2,'#ffffff');
  }
}

  rect(x,196,46,16,on?c:'#0a0f22');

function render(){
  rect(0,0,W,H,'#04050d');
  ctx.save();
  ctx.translate(Math.round(shx),Math.round(shy));
  drawField();

  drawPanel();
  drawOverlays();

/* ==================== input ==================== */
window.addEventListener('keydown',e=>{
  const k=e.key;
  if([' ','ArrowLeft','ArrowRight','ArrowDown','/','z','Z','x','X','n','N','p','P','m','M','a','A'].includes(k))e.preventDefault();
  ac();
  if(k===' '){if(!e.repeat)setKey('space',true);}
  else if(k==='z'||k==='Z'||k==='a'||k==='A'||k==='ArrowLeft'){keys.left=true;setKey('left',true);}
  else if(k==='/'||k==='x'||k==='X'||k==='ArrowRight'){keys.right=true;setKey('right',true);}
  else if((k==='n'||k==='N'||k==='ArrowDown')&&!e.repeat)nudge();
  else if((k==='p'||k==='P')&&!e.repeat)paused=!paused;
  else if((k==='m'||k==='M')&&!e.repeat){muted=!muted;msg(muted?'SOUND OFF':'SOUND ON','#8a97c4');}
});
window.addEventListener('keyup',e=>{
  const k=e.key;
  if(k===' ')setKey('space',false);
  else if(k==='z'||k==='Z'||k==='a'||k==='A'||k==='ArrowLeft')setKey('left',false);
  else if(k==='/'||k==='x'||k==='X'||k==='ArrowRight')setKey('right',false);
});
function pad(id,down,up){
  const el=document.getElementById(id);if(!el)return;
  const dn=e=>{e.preventDefault();ac();down();};
  const upp=e=>{e.preventDefault();if(up)up();};
  el.addEventListener('pointerdown',dn);
  el.addEventListener('pointerup',upp);
  el.addEventListener('pointercancel',upp);
  el.addEventListener('pointerleave',upp);
}
pad('padL',()=>{if(mode==='attract'||(mode==='over'&&overT>0.8))startGame();else setKey('left',true);},()=>setKey('left',false));
pad('padR',()=>{if(mode==='attract'||(mode==='over'&&overT>0.8))startGame();else setKey('right',true);},()=>setKey('right',false));
pad('padP',()=>setKey('space',true),()=>setKey('space',false));
cv.addEventListener('pointerdown',()=>{
  ac();
  if(mode==='attract')startGame();
  else if(mode==='over'&&overT>0.8)startGame();
});

/* ==================== main loop ==================== */
let last=0,lastTick=0;
function frame(ts){
  if(!last)last=ts;
  let dt=(ts-last)/1000;last=ts;
  if(dt>0.06)dt=0.06;
  update(dt);
  render();
  lastTick=performance.now();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
/* fallback pump: keeps the game alive where rAF stalls (headless capture, heavy throttling) */
setInterval(()=>{
  if(performance.now()-lastTick>120){lastTick=performance.now();update(1/60);render();}
},30);

/* e2e smoke mode for automated testing: index.html#smoke (idle AI + state reporting via document.title) */
if(location.hash==='#smoke'){
  let charging=false;
  setInterval(()=>{
    if(mode==='attract'||mode==='over'){charging=false;startGame();}
    else if(mode==='plunger'){
      if(!charging){charging=true;setKey('space',true);}
      else if(power>=1){charging=false;setKey('space',false);}
    }else if(charging){charging=false;setKey('space',false);}
  },350);
  setInterval(()=>{document.title='SMOKE'+JSON.stringify({m:mode,s:score,b:balls,n:ballNo});},2000);
}

/* hidden demo mode for attract screens / testing: index.html#demo */
if(location.hash==='#demo'){
  let charging=false;
  setInterval(()=>{
    if(mode==='attract'||mode==='over'){charging=false;startGame();}
    else if(mode==='plunger'){
      if(!charging){charging=true;setKey('space',true);}
      else if(power>=1){charging=false;setKey('space',false);}
    }else{
      if(charging){charging=false;setKey('space',false);}
      setKey('left',Math.random()<0.5);setKey('right',Math.random()<0.5);
      if(Math.random()<0.03&&!tilt)nudge();
    }
  },350);
}

/* test hook (harmless in browser) */
window.__PP={
  update,render,startGame,
  key:setKey,
  nudge,
  get state(){return{mode,score,balls,ballNo,mult,high,x:ball.x,y:ball.y,tilt,kick:kickLit,extra:extraLit};},
  step(n){for(let i=0;i<n;i++){update(1/60);if(i%5===0)render();}}
};
